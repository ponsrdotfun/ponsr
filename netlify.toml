[build]
  publish = "website"
  command = "npm run build:website"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # sharp carries platform-specific native binaries, and the card function needs
  # the mascot art on disk beside it.
  external_node_modules = ["sharp"]
  included_files = ["website/logo-transparent.png", "website/data/launches.json"]

[[redirects]]
  from = "/api/*"
  to = "https://ponsr-backend.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/explore/index.html"
  status = 200

# The token card endpoint. `/social/token/<address>.png` renders a card for any
# address the canonical feed can verify, including one launched since the last
# build -- which is exactly when a link gets shared.
[[redirects]]
  from = "/social/token/*"
  to = "/.netlify/functions/token-card/:splat"
  status = 200

[[redirects]]
  from = "/token/*"
  to = "/token/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://pbs.twimg.com; connect-src 'self'; frame-src https://www.geckoterminal.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/explore/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/token/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
