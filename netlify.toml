# Netlify equivalent of vercel.json — use whichever host you deploy to, not both.
# The site is static: no build step, `website/` is published as-is.

[build]
  publish = "website"
  command = ""

# Pretty routes. The app reads its route from either the path or the query
# string, so these rewrites are what let /explore and /token/GCAT survive a
# refresh or a direct visit. Flip PRETTY_URLS to true in website/index.html in
# the same commit, so the app also *writes* URLs in this shape.
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/token/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The logo art never changes without a filename change; the HTML always should
# be revalidated so a deploy is visible immediately.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
