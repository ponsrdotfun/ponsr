# The verification matrix, run by GitHub rather than claimed in a pull request body.
#
# Every check here was previously run on a maintainer's laptop and reported as a table.
# That is not evidence anybody else can audit: a green pull request with no automation
# behind it looks exactly like a verified one, and this repository has already shipped a
# stale artifact, a vacuously-passing test, and a verifier that confirmed the wrong
# contract. Each of those passed a local run and would have failed a second, independent
# one.
#
# Nothing here signs, broadcasts, deploys, or reads a secret. The contract suite forks
# mainnet only when FORK=1, which is never set, so the whole matrix runs offline apart
# from installing dependencies and the audit query.

name: verify

on:
  pull_request:
  push:

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact patch, not "22". A floating major silently changes the
      # runtime under a native module (better-sqlite3) and under the compiler pin the
      # artifact reproducibility check depends on.
      #
      # 22.23.0 specifically, and the patch level is load-bearing. The website smoke
      # test loads jsdom, whose `html-encoding-sniffer` reaches `@exodus/bytes` through
      # a CommonJS `require()` of an ES module. That only works from Node 22.12, where
      # `require(esm)` shipped unflagged; this file first pinned 22.11.0 and the smoke
      # test died with ERR_REQUIRE_ESM while passing on the maintainer's 22.23.0. So
      # this matches the version the suite is actually verified on, rather than being
      # a version somebody assumed was equivalent.
      #
      # The deployed bot is unaffected -- jsdom is a root devDependency used only to
      # parse the website in tests, and backend/Dockerfile builds on node:22-slim.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # 1. Clean root install. `npm ci`, not `npm install`: it installs the lockfile
      #    exactly and fails if the lockfile and manifest disagree, which is the whole
      #    point of running it here.
      - name: root npm ci
        run: npm ci

      # 2. Clean backend install.
      - name: backend npm ci
        run: npm ci
        working-directory: backend

      # 3a. The FULL typecheck, which is not the same as the build.
      #
      # tsconfig.build.json deliberately excludes tests/ and scripts/ so the production
      # image does not ship operator tooling. A build alone therefore cannot see a type
      # error in a script -- and one shipped exactly that way: an `asserts` signature
      # aimed at a module-scope binding, which made the script unbuildable while
      # `npm run build` stayed green. Both run, in this order.
      - name: backend typecheck (src, tests and scripts)
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      # 3b. The production build.
      - name: backend build
        run: npm run build
        working-directory: backend

      # 3c. Complete backend suite.
      - name: backend tests
        run: npm test
        working-directory: backend

      # 4. Contract tests. Run from the root, where hardhat.config.js lives; artifacts are
      #    committed and compiled out-of-band, hence --no-compile in the root script.
      #    FORK is unset, so this uses the in-process Hardhat network and reaches nothing.
      - name: contract tests
        run: npm test

      # 5. Website smoke tests. No install needed by design.
      - name: website smoke tests
        run: node website/smoke-test.js

      # 6. Artifact reproducibility, twice.
      #
      # Twice on purpose. A single run cannot distinguish a deterministic compile from
      # one that happened to agree once -- and solc embeds a hash of the source into the
      # deployed bytecode's metadata, so anything that varies per run (line endings, a
      # path, a timestamp) shows up as a difference on the second pass and not the first.
      - name: artifact reproducibility (run 1)
        run: node scripts/verify-artifacts-reproducible.js

      - name: artifact reproducibility (run 2)
        run: node scripts/verify-artifacts-reproducible.js

      # 7. Whitespace errors, and proof that nothing above rewrote a tracked file.
      #    Compared against HEAD rather than the index so a build that dirties the tree
      #    fails here instead of being discovered later.
      - name: git diff --check
        run: git diff --check HEAD

      # 8. Production dependency audit for the one tree that is actually deployed.
      #    --omit=dev on purpose: the root toolchain carries known build-time advisories
      #    that are not reachable from anything a user can send the bot, and are
      #    documented in docs/DEPENDENCY-RISK.md. This gate is about the running bot.
      - name: backend npm audit (production deps)
        run: npm audit --omit=dev
        working-directory: backend

  # A SECOND job, on real Windows, for one reason: the raw-transaction journal's
  # protection there is an ACL and nothing else. Windows does not implement POSIX mode
  # bits -- `fs.stat().mode` reports a synthesised 0666 whatever the real ACL says -- so
  # the Linux job above cannot exercise that code path at all, and a defect in it went
  # unnoticed precisely because nothing ran it.
  #
  # Scoped to the journal suites rather than the whole matrix. The point is custody of
  # broadcast-ready bytes on the one platform where that is enforced differently, not a
  # second full run of everything the Linux job already proved.
  verify-windows-acl:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: backend npm ci
        run: npm ci
        working-directory: backend

      - name: backend typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      # The ACL suite, plus the journal and signing suites that write raw_tx, so the
      # files whose custody is being asserted are produced by the real path.
      - name: journal custody tests (Windows)
        run: npx jest tests/journalWindowsAcl.test.ts tests/canaryJournal.test.ts tests/signedTxFlow.test.ts --runInBand
        working-directory: backend
